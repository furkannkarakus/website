<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tadilattayız!</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="sahne" aria-label="Tadilattayız sahnesi">
    <!-- 1. Masadaki Çay Bardağı (Instagram) -->
    <a
      href="https://instagram.com/furkankarakuss0"
      target="_blank"
      rel="noopener noreferrer"
      class="cay-buton"
      data-instagram-link
      aria-label="Instagram profiline git"
    >
      <div class="buhar" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <img src="cay-bardagi.png" alt="Instagram">
      <span class="ipucu">@furkankarakuss0</span>
    </a>

    <!-- 2. Yerdeki Zarf (Doğrudan İletişim) -->
    <div
      class="zarf-buton"
      id="zarf-buton"
      role="button"
      tabindex="0"
      aria-label="İletişim e-posta adresini göster"
    >
      <img src="zarf-kapali.png?v=2" alt="İletişim Zarfı Kapalı" class="zarf-gorsel kapali-hal">
      <img src="zarf-acik.png?v=2" alt="İletişim Zarfı Açık" class="zarf-gorsel acik-hal">

      <div class="mail-kutu" id="mail-kutu">
        <span class="mail-baslik">Doğrudan İletişim</span>
        <div class="mail-satir">
          <a href="mailto:info@furkankarakus.com" class="mail-link" id="email-link">
            info@furkankarakus.com
          </a>
          <button type="button" class="kopyala-btn" id="kopyala-btn">Kopyala</button>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
